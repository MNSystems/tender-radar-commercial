name: Buyer search (покупатели товара, только чтение)
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Ключевые слова через запятую'
        required: true
        type: string
      minus:
        description: 'Минус-слова через запятую'
        required: false
        type: string
        default: ''
      months:
        description: 'За сколько месяцев смотреть договоры'
        required: false
        type: string
        default: '12'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 pypdf==6.1.1
      - name: Search
        env:
          KW: ${{ inputs.keywords }}
          MINUS: ${{ inputs.minus }}
          MONTHS: ${{ inputs.months }}
        run: python buyer_search.py --keywords "$KW" --minus "$MINUS" --months "$MONTHS"
