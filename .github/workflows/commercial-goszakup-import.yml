name: Commercial Goszakup import
on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-test-collector
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install requests==2.32.5 pypdf==6.1.1
      - name: Import sample into new commercial database
        env:
          TRKZ_TEST_SUPABASE_URL: https://aypqwhhplogolzczubwi.supabase.co
          TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TRKZ_TEST_GOSZAKUP_TOKEN: ${{ secrets.TRKZ_TEST_GOSZAKUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python collect_commercial_test.py --limit 50 --apply | tee /tmp/trkz-import.log
      - name: Run result
        if: always()
        shell: bash
        env:
          IMPORT_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Commercial import"
            echo "Result: $IMPORT_RESULT"
            echo "Target: aypqwhhplogolzczubwi"
            echo "Coverage: bounded sample; notifications are disabled"
            if [ -f /tmp/trkz-import.log ]; then
              echo '~~~json'
              tail -n 1 /tmp/trkz-import.log
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
