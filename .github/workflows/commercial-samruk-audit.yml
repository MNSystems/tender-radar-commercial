name: Commercial Samruk audit (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-samruk-audit
  cancel-in-progress: false
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install requests==2.32.5 pypdf==6.1.1 selenium==4.36.0
      - name: Audit Samruk without database writes
        env:
          TRKZ_TEST_SUPABASE_URL: https://aypqwhhplogolzczubwi.supabase.co
          TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: python collect_commercial_samruk_audit.py
