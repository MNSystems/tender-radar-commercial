name: Keep scheduled workflows enabled
# GitHub turns off scheduled workflows in public repositories after 60 days without
# repository activity. This job re-enables the collectors once a month so that
# tender collection never stops silently.
on:
  schedule:
    - cron: '23 4 1,15 * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable collector workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for wf in commercial-goszakup-import.yml commercial-samruk-import.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" || true
          done
          echo "Keepalive done: $(date -u +%FT%TZ)"
