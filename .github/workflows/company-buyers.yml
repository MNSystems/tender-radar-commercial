name: Company buyers (покупатели для компании, только чтение)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'id:название;id:название'
        required: true
        type: string
      months:
        description: 'Глубина истории компании, мес'
        required: false
        type: string
        default: '24'
      probe_bin:
        description: 'Разведка: БИН:название'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 pypdf==6.1.1
      - name: Search
        env:
          IDS: ${{ inputs.ids }}
          MONTHS: ${{ inputs.months }}
          PROBE_BIN: ${{ inputs.probe_bin }}
        run: python company_buyers.py --ids "$IDS" --months "$MONTHS" --probe_bin "$PROBE_BIN"
