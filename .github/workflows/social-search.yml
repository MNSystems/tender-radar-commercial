name: Social search (сайты и соцсети компаний, только чтение)
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'gzip+base64 JSON [[idx, name, city], ...]'
        required: true
        type: string
      pubkey:
        description: 'base64 PEM public key for encrypted output'
        required: false
        type: string
        default: ''
      ddg:
        description: '1 = искать также через DuckDuckGo'
        required: false
        type: string
        default: '1'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 pypdf==6.1.1 cryptography==44.0.0
      - name: Search
        env:
          NAMES: ${{ inputs.names }}
          DDG: ${{ inputs.ddg }}
          PUBKEY: ${{ inputs.pubkey }}
        run: python -u social_search.py
