name: Social search (сайты и соцсети компаний, только чтение)
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'gzip+base64 JSON [[idx, name, city], ...]'
        required: true
        type: string
      ddg:
        description: '1 = искать также через DuckDuckGo'
        required: false
        type: string
        default: '1'
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 pypdf==6.1.1
      - name: Search
        env:
          NAMES: ${{ inputs.names }}
          DDG: ${{ inputs.ddg }}
        run: python social_search.py
