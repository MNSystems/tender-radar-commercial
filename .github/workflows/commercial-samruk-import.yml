name: Commercial Samruk import (manual)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write verified lots to the new commercial database'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: commercial-samruk-audit
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install requests==2.32.5 pypdf==6.1.1 selenium==4.36.0
      - name: Check or import verified Samruk sample
        env:
          TRKZ_TEST_SUPABASE_URL: https://aypqwhhplogolzczubwi.supabase.co
          TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          APPLY_IMPORT: ${{ inputs.apply }}
        run: |
          if [ "$APPLY_IMPORT" = "true" ]; then
            python collect_commercial_samruk_import.py --apply
          else
            python collect_commercial_samruk_import.py
          fi
