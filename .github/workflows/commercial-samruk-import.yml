name: Commercial Samruk import
on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write verified lots to the new commercial database'
        type: boolean
        required: true
        default: false
      send_notifications:
        description: 'Send through the new commercial bot after verified import'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: commercial-new-import-and-notify
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install requests==2.32.5 pypdf==6.1.1 selenium==4.36.0
      - name: Check or import verified Samruk sample
        env:
          TRKZ_TEST_SUPABASE_URL: https://aypqwhhplogolzczubwi.supabase.co
          TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          APPLY_IMPORT: ${{ github.event_name == 'schedule' || inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$APPLY_IMPORT" = "true" ]; then
            python collect_commercial_samruk_import.py --apply | tee /tmp/trkz-import.log
          else
            python collect_commercial_samruk_import.py | tee /tmp/trkz-import.log
          fi
      - name: Check or send new commercial Telegram digest
        if: github.event_name == 'schedule' || inputs.apply
        env:
          TRKZ_TEST_SUPABASE_URL: https://aypqwhhplogolzczubwi.supabase.co
          TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRKZ_TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TRKZ_TEST_TELEGRAM_BOT_TOKEN: ${{ secrets.TRKZ_TEST_TELEGRAM_BOT_TOKEN }}
          TRKZ_TELEGRAM_APPLY: ${{ github.event_name == 'schedule' || inputs.send_notifications }}
        shell: bash
        run: |
          set -euo pipefail
          python telegram_notify_commercial.py | tee /tmp/trkz-notify.log
      - name: Run result
        if: always()
        shell: bash
        env:
          IMPORT_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Commercial import"
            echo "Result: $IMPORT_RESULT"
            echo "Target: aypqwhhplogolzczubwi"
            echo "Coverage: bounded sample; Telegram result below"
            if [ -f /tmp/trkz-import.log ]; then
              echo '~~~json'
              tail -n 1 /tmp/trkz-import.log
              echo '~~~'
            fi
            if [ -f /tmp/trkz-notify.log ]; then
              echo "## Telegram digest"
              echo '~~~json'
              tail -n 1 /tmp/trkz-notify.log
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
